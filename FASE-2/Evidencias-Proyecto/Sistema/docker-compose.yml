version: '3.8'

services:
  api-entrecasas:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DB_HOST=db-entrecasas
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=entrecasas_db
    depends_on:
      - db-entrecasas

  db-entrecasas:
    image: mariadb:10.11
    ports:
      - "3307:3306" # Expone la DB en el 3307 de tu PC para no chocar con Laragon
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=entrecasas_db
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: